/* ── TICKER ── */
function NewsTicker() {
  const [idx, setIdx] = useState(0);
  const [vis, setVis] = useState(true);
  useEffect(() => {
    const t = setInterval(() => {
      setVis(false);
      setTimeout(() => { setIdx(i => (i+1) % TICKER.length); setVis(true); }, 300);
    }, 4000);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{background:"#FF003C",borderBottom:"2px solid #E1FF00",padding:"8px 12px",display:"flex",alignItems:"center",gap:"8px",minHeight:"40px"}}>
      <div style={{background:"#000",color:"#E1FF00",fontSize:"9px",fontWeight:900,letterSpacing:"0.15em",padding:"2px 6px",flexShrink:0,border:"1px solid #E1FF00"}}>LIVE</div>
      <div style={{color:"#fff",fontSize:"11px",fontWeight:700,letterSpacing:"0.04em",opacity:vis?1:0,transition:"opacity 0.3s",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
        {TICKER[idx]}
      </div>
    </div>
  );
}

/* ── STATUS BADGE ── */
function StatusBadge({ status }) {

      <c.Icon size={8} color={c.color}/> {c.label}
    </span>
  );
}

/* ── DRAMA BAR ── */
function DramaBar({ value }) {
  const color = value >= 90 ? "#FF003C" : value >= 70 ? "#FF6B00" : "#E1FF00";
  return (
    <div style={{width:"100%",background:"#222",height:"4px",marginTop:"4px"}}>
      <div style={{width:`${value}%`,height:"100%",background:color,transition:"width 0.4s"}}/>
    </div>
  );
}

/* ── SENATOR CARD ── */

    <div onClick={() => onToggle(senator)} style={{background:inRoster?"#0d1a00":"#121212",border:`2px solid ${inRoster?"#E1FF00":"#2a2a2a"}`,padding:"10px",cursor:"pointer",position:"relative",transition:"border-color 0.2s,background 0.2s"}}>

  return (

      <div style={{display:"flex",gap:"4px",padding:"8px 10px",overflowX:"auto",borderBottom:"1px solid #1a1a1a",background:"#0a0a0a"}}>
        {filters.map(fi => {

          const col = fColor(fi);
          return (
            <button key={fi} onClick={() => setF(fi)} style={{background:active?col:"#000",border:`1px solid ${col}`,color:active?"#000":col,fontSize:"7px",fontWeight:900,padding:"3px 7px",flexShrink:0,letterSpacing:"0.1em",transition:"all 0.15s"}}>

          { lbl:"DRAMA INTENSITY",  val:"GRABE",     I:Flame     },
          { lbl:"WALKING WOUNDED",  val:"Chiz, Win", I:AlertTriangle },
          { lbl:"CURRENT VERDICT",  val:verdict,     I:Trophy    },
        ].map(({ lbl, val, I }) => (
          <div key={lbl} style={{background:"#121212",border:"1px solid #2a2a2a",padding:"8px",display:"flex",flexDirection:"column",gap:"2px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
              <I size={9} color="#6B7280"/>
              <span style={{color:"#6B7280",fontSize:"8px",letterSpacing:"0.1em"}}>{lbl}</span>
            </div>
            <span style={{color:"#E1FF00",fontSize:"13px",fontWeight:900,fontFamily:"monospace"}}>{val}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── DYNASTY TAB ── */
function DynastyTab() {
  const [open, setOpen] = useState(null);
  const total = DYNASTIES.reduce((a,d) => a+d.pct, 0);
  return (
    <div style={{padding:"12px"}}>
      <div style={{background:"#000",border:"2px solid #E1FF00",padding:"8px 12px",marginBottom:"12px"}}>
        <div style={{color:"#E1FF00",fontSize:"9px",fontWeight:900,letterSpacing:"0.15em"}}>DYNASTY MONOPOLY TRACKER</div>
        <div style={{color:"#9CA3AF",fontSize:"10px",marginTop:"3px"}}>Sino ang nagmamay-ari ng Senado? Lahat ng kamag-anak, lahat ng komite.</div>
      </div>
      {/* control bars */}
      <div style={{background:"#121212",border:"2px solid #2a2a2a",padding:"12px",marginBottom:"12px"}}>
        <div style={{color:"#9CA3AF",fontSize:"9px",letterSpacing:"0.1em",marginBottom:"8px"}}>COMBINED DYNASTY CONTROL</div>
        {DYNASTIES.map(d => (
          <div key={d.family} style={{marginBottom:"6px"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
              <span style={{color:d.color,fontSize:"10px",fontWeight:900,letterSpacing:"0.1em"}}>{d.family}</span>
              <span style={{color:d.color,fontSize:"10px",fontWeight:900,fontFamily:"monospace"}}>{d.pct}%</span>
            </div>
            <div style={{background:"#000",height:"8px",border:`1px solid ${d.color}33`}}>
              <div style={{width:`${d.pct}%`,height:"100%",background:d.color,transition:"width 0.6s"}}/>
            </div>
          </div>
        ))}
        <div style={{marginTop:"8px",borderTop:"1px solid #2a2a2a",paddingTop:"6px",display:"flex",justifyContent:"space-between"}}>
          <span style={{color:"#6B7280",fontSize:"9px",letterSpacing:"0.1em"}}>TOTAL DYNASTY GRIP</span>
          <span style={{color:"#E1FF00",fontSize:"14px",fontWeight:900,fontFamily:"monospace"}}>{total}%</span>
        </div>
      </div>
      {/* accordion cards */}
      {DYNASTIES.map(d => {
        const isOpen = open === d.family;
        return (
          <div key={d.family} style={{background:"#121212",border:`2px solid ${isOpen?d.color:"#2a2a2a"}`,marginBottom:"8px",transition:"border-color 0.2s"}}>
            <button onClick={() => setOpen(isOpen ? null : d.family)} style={{width:"100%",background:"none",border:"none",padding:"10px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <Crown size={14} color={d.color}/>
                <div style={{textAlign:"left"}}>
                  <div style={{color:d.color,fontSize:"13px",fontWeight:900,letterSpacing:"0.12em"}}>PAMILYA {d.family}</div>
                  <div style={{color:"#6B7280",fontSize:"9px",marginTop:"1px"}}>{d.members.length} aktibong miyembro · {d.committees.length} komite</div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <div style={{background:d.color,color:"#000",fontSize:"12px",fontWeight:900,fontFamily:"monospace",padding:"2px 6px"}}>{d.pct}%</div>
                {isOpen ? <ChevronUp size={14} color={d.color}/> : <ChevronDown size={14} color="#6B7280"/>}
              </div>
            </button>
            {isOpen && (
              <div style={{borderTop:`1px solid ${d.color}44`,padding:"10px 12px",background:"#0a0a0a"}}>
                <div style={{marginBottom:"8px"}}>
                  <div style={{color:"#9CA3AF",fontSize:"8px",letterSpacing:"0.1em",marginBottom:"4px"}}>KASALUKUYANG MIYEMBRO</div>
                  {d.members.map(m => (
                    <div key={m} style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"3px"}}>
                      <div style={{width:"6px",height:"6px",background:d.color,flexShrink:0}}/>
                      <span style={{color:"#F3F4F6",fontSize:"10px",fontWeight:700}}>{m}</span>
                    </div>
                  ))}
                  {d.exMembers.map(m => (
                    <div key={m} style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"3px"}}>
                      <div style={{width:"6px",height:"6px",background:"#444",flexShrink:0}}/>
                      <span style={{color:"#6B7280",fontSize:"9px",fontStyle:"italic"}}>{m}</span>
                    </div>
                  ))}
                </div>
                <div style={{marginBottom:"8px"}}>
                  <div style={{color:"#9CA3AF",fontSize:"8px",letterSpacing:"0.1em",marginBottom:"4px"}}>HAWAK NA KOMITE</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"4px"}}>
                    {d.committees.map(c => (
                      <span key={c} style={{background:`${d.color}18`,border:`1px solid ${d.color}55`,color:d.color,fontSize:"8px",fontWeight:700,padding:"2px 5px",letterSpacing:"0.05em"}}>{c}</span>
                    ))}
                  </div>
                </div>
                <div style={{background:"#111",border:`1px solid ${d.color}33`,padding:"6px 8px"}}>
                  <div style={{color:"#9CA3AF",fontSize:"9px",lineHeight:1.5}}>📌 {d.note}</div>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── CORE 5 FOOTER ── */
function CoreFiveFooter({ roster }) {
  const sorted = [...roster].sort((a,b) => b.pts - a.pts);
  const total = sorted.reduce((s,r) => s+r.pts, 0);
  const maxPts = [...SENATORS].sort((a,b) => b.pts - a.pts).slice(0,5).reduce((s,r) => s+r.pts, 0);
  const eff = total > 0 ? Math.round((total/maxPts)*100) : 0;
  const effLabel = eff >= 80 ? "🔥 SOLID LINEUP" : eff >= 60 ? "⚡ PWEDE NA" : "💀 KAILANGAN PA";
  const effColor = eff >= 80 ? "#E1FF00" : eff >= 60 ? "#FF6B00" : "#FF003C";

  return (
    <div style={{position:"sticky",bottom:0,background:"#000",borderTop:"2px solid #E1FF00",zIndex:100}}>
      <div style={{background:"#E1FF00",padding:"4px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
          <Star size={10} color="#000"/>
          <span style={{color:"#000",fontSize:"9px",fontWeight:900,letterSpacing:"0.15em"}}>MY CORE 5</span>
        </div>
        <div style={{display:"flex",gap:"12px"}}>
          {[["TOTAL PTS",total],["EFFICIENCY",`${eff}%`]].map(([lbl,val]) => (
            <div key={lbl} style={{textAlign:"right"}}>
              <div style={{color:"#000",fontSize:"8px",fontWeight:700,letterSpacing:"0.1em"}}>{lbl}</div>
              <div style={{color:"#000",fontSize:"16px",fontWeight:900,fontFamily:"monospace",lineHeight:1}}>{val}</div>
            </div>
          ))}
        </div>
      </div>
      {roster.length === 0
        ? <div style={{padding:"8px 12px",color:"#6B7280",fontSize:"9px",textAlign:"center",letterSpacing:"0.1em"}}>Wala pang napili — i-tap ang isang senator para idagdag sa Core 5</div>
        : (
          <div style={{display:"flex",gap:"4px",padding:"6px 8px",overflowX:"auto"}}>
            {sorted.map(s => (
              <div key={s.id} style={{background:"#121212",border:"1px solid #E1FF00",padding:"4px 6px",flexShrink:0,minWidth:"70px"}}>
                <div style={{color:"#E1FF00",fontSize:"8px",fontWeight:900,letterSpacing:"0.05em",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"80px"}}>{s.name.split(" ").pop()}</div>
                <div style={{color:"#F3F4F6",fontSize:"13px",fontWeight:900,fontFamily:"monospace"}}>{s.pts}</div>
              </div>
            ))}
            {roster.length < 5 && (
              <div style={{background:"#0a0a0a",border:"1px dashed #3a3a3a",padding:"4px 6px",flexShrink:0,minWidth:"50px",display:"flex",alignItems:"center",justifyContent:"center",color:"#3a3a3a",fontSize:"18px"}}>+</div>
            )}
          </div>
        )
      }
      {total > 0 && (
        <div style={{padding:"4px 12px",background:"#0a0a0a",borderTop:"1px solid #1a1a1a",fontSize:"8px",color:"#6B7280",letterSpacing:"0.04em",display:"flex",flexWrap:"wrap",gap:"4px",alignItems:"center"}}>
          <span>{sorted.map(s=>`${s.name.split(" ").pop()} (${s.pts})`).join(" + ")} = {total} pts</span>
          {roster.length === 5 && <span style={{color:effColor,fontWeight:900}}>{effLabel}</span>}
        </div>
      )}
    </div>
  );
}

/* ── ROOT APP ── */
function Bardagulan() {
  const [tab, setTab] = useState("grid");
  const [roster, setRoster] = useState([]);

  const toggleRoster = (senator) => {
    setRoster(prev => {
      if (prev.find(s => s.id === senator.id)) return prev.filter(s => s.id !== senator.id);
      if (prev.length >= 5) return prev;
      return [...prev, senator];
    });
  };

  const TABS = [
    { id:"grid",    label:"LIVE GRID", I:Radio  },
    { id:"resibo",  label:"RESIBO",    I:Swords },
    { id:"dynasty", label:"DYNASTY",   I:Crown  },
  ];

  return (
    <div style={{background:"#000",minHeight:"100vh",maxWidth:"480px",margin:"0 auto",color:"#F3F4F6",paddingBottom:"160px"}}>
      {/* MASTHEAD */}
      <div style={{background:"#000",borderBottom:"3px solid #E1FF00",padding:"12px 12px 8px"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
          <div>
            <div style={{color:"#E1FF00",fontSize:"24px",fontWeight:900,letterSpacing:"0.08em",textTransform:"uppercase",lineHeight:1}}>BARDAGULAN</div>
            <div style={{color:"#FF003C",fontSize:"9px",fontWeight:900,letterSpacing:"0.2em",marginTop:"2px"}}>SENATE FANTASY LEAGUE · SEASON 2026</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{background:"#FF003C",color:"#fff",fontSize:"8px",fontWeight:900,padding:"2px 6px",letterSpacing:"0.15em",marginBottom:"2px",display:"inline-block"}}>LIVE</div>
            <div style={{color:"#6B7280",fontSize:"8px",display:"block"}}>WK 26 / SY 2026</div>
          </div>
        </div>
      </div>

      <NewsTicker/>

      {/* TABS */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",borderBottom:"2px solid #1a1a1a",position:"sticky",top:0,background:"#000",zIndex:50}}>
        {TABS.map(({ id, label, I }) => (
          <button key={id} onClick={() => setTab(id)} style={{background:tab===id?"#E1FF00":"#000",border:"none",borderRight:"1px solid #1a1a1a",color:tab===id?"#000":"#6B7280",padding:"10px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px",transition:"all 0.15s"}}>
            <I size={13} color={tab===id?"#000":"#6B7280"}/>
            <span style={{fontSize:"8px",fontWeight:900,letterSpacing:"0.1em"}}>{label}</span>
          </button>
        ))}
      </div>

      {tab === "grid"    && <LiveGridTab roster={roster} onToggle={toggleRoster}/>}
      {tab === "resibo"  && <ResiboTab/>}
      {tab === "dynasty" && <DynastyTab/>}

      <CoreFiveFooter roster={roster}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(Bardagulan));
</script>
</body>
</html>
